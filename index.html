
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anatomy Click Challenge</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            text-align: center;
        }

        header {
            background: #ffffff;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        #question {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .game-container {
            max-width: 900px;
            margin: 25px auto;
            padding: 20px;
        }

        #image-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }

        #anatomy-image {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.2);
        }

        /*
            Invisible clickable areas.

            Each area is positioned using percentages so the
            game works on different screen sizes.
        */

        .click-area {
            position: absolute;
            cursor: pointer;
            border-radius: 50%;
        }

        /*
            Turn this on temporarily if you want to see
            where the clickable areas are.

            Change opacity from 0 to 0.3 while testing.
        */

        .click-area.debug {
            background: rgba(255, 0, 0, 0.3);
        }

        #feedback {
            min-height: 45px;
            font-size: 20px;
            font-weight: bold;
            margin: 15px;
        }

        .correct {
            color: green;
        }

        .wrong {
            color: red;
        }

        button {
            border: none;
            padding: 12px 25px;
            font-size: 17px;
            border-radius: 8px;
            cursor: pointer;
            background: #333;
            color: white;
            margin: 5px;
        }

        button:hover {
            background: #555;
        }

        #next-button {
            display: none;
        }

        .progress {
            width: 90%;
            max-width: 500px;
            height: 12px;
            background: #ddd;
            border-radius: 10px;
            margin: 15px auto;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: #333;
            transition: width 0.3s;
        }

        #start-screen {
            margin-top: 100px;
        }

        #game-screen {
            display: none;
        }

        #end-screen {
            display: none;
            margin-top: 80px;
        }

        .big-score {
            font-size: 40px;
            font-weight: bold;
            margin: 20px;
        }
    </style>
</head>
